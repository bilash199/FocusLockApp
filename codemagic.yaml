workflows:
  android-build:
    name: Focus Lock APK Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build Android APK
        script: |
          gradle build
          mkdir -p apk_output
          find . -name "*.apk" -exec cp {} apk_output/ \;
    artifacts:
      - apk_output/*.apk
    publishing:
      github_releases:
        events:
          - push
        prerelease: false
