name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restructure Project Layout
        run: |
          mkdir -p app/src/main/java/com/focuslock/app
          mkdir -p app/src/main/res
          
          # Move Kotlin files to correct package directory
          mv *.kt app/src/main/java/com/focuslock/app/ 2>/dev/null || true
          
          # Move AndroidManifest.xml
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
          
          # Move res folder
          cp -r res/* app/src/main/res/ 2>/dev/null || true

      - name: Create app/build.gradle
        run: |
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }

          android {
              namespace 'com.focuslock.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.focuslock.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Create Root build.gradle
        run: |
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Create settings.gradle
        run: |
          echo "include ':app'" > settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-APK
          path: app/build/outputs/apk/debug/*.apk
